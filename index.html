async function submitVote(censusId,option){
  if(!option){showToast('Select an option first','error');return}
  if(!currentUser?.verified){showToast('Verify email to vote','error');return}
  try{
    const poll=await dbGet(`censuses/${censusId}`);
    if(poll.votes&&poll.votes[currentUser.id]){showToast('Already voted','error');return}
    await dbUpdate(`censuses/${censusId}/votes`,{[currentUser.id]:option});
    await dbUpdate(`censuses/${censusId}`,{totalVotes:(poll.totalVotes||0)+1});
    showToast(`Voted for "${option}"!`,'success');
    await pushNotif(poll.creatorId,{text:`${currentUser.name} voted on your poll: "${poll.title}"`,icon:'🗳️',color:'#a855f7'});
    renderCensusDetail(censusId);
  }catch(err){showToast('Failed to vote: '+err.message,'error')}
}

    if(!usersData){c.innerHTML='<div class="empty-state"><h3>No users yet</h3></div>';return}
    
    // Prepare lists for sorting
    let list=Object.entries(usersData).map(([id,u])=>({id,...u})).filter(u=>u.role!=='banned');
    
    // Sort by individual metrics
    const sortByBalance = [...list].sort((a,b)=>(b.balance||0)-(a.balance||0));
    const sortByPredictions = [...list].sort((a,b)=>(b.predictions||b.trades||0)-(a.predictions||a.trades||0));
    const sortByProfit = [...list].sort((a,b)=>(b.profit||0)-(a.profit||0));

    // Calculate Average Rank for each user
    list = list.map(user => {
      // Find rank in each category (index + 1)
      const rBalance = sortByBalance.findIndex(u => u.id === user.id) + 1;
      const rActivity = sortByPredictions.findIndex(u => u.id === user.id) + 1;
      const rProfit = sortByProfit.findIndex(u => u.id === user.id) + 1;

      // Calculate average (Activity doesn't factor heavily, but ensures tie-breaking)
      // Formula: Average of (Balance Rank + Profit Rank)
      const avgRank = (rBalance + rProfit) / 2;
      
      return { ...user, avgRank, rBalance, rActivity, rProfit };
    });

    // Sort final list by Average Rank
    const sorted = [...list].sort((a, b) => a.avgRank - b.avgRank);

    c.innerHTML=`
      <div class="page">
        <h1 class="page-title">🏆 Leaderboard</h1>
        <div style="margin-bottom:18px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;font-size:.82rem;color:var(--text-secondary)">
          Ranking is calculated based on average position across <strong style="color:var(--text)">Accuracy Score</strong> and <strong style="color:var(--text)">Profit</strong>.
        </div>
        <div class="card" style="overflow:hidden">
          ${sorted.map((u,i)=>{
            const rankPos=i+1;
            
            // Assign Tier Classes
            let rankClass = '';
            let rankIcon = rankPos;
            
            if(rankPos <= 3) {
              rankClass = 'gold'; // Top 3 uses existing gold styling
              rankIcon = ['🥇','🥈','🥉'][rankPos-1];
            } else if(rankPos <= 6) {
              rankClass = 'silver'; // 4-6
            } else if(rankPos <= 9) {
              rankClass = 'bronze'; // 7-9
            }
            // 10+ has no special class/icon formatting

            return`<div class="lb-row" data-user-id="${u.id}">
              <div class="lb-rank ${rankClass}">${rankIcon}</div>
              <div class="lb-avatar" style="background:${avatarColor(u.name)}22;color:${avatarColor(u.name)}">${initials(u.name)}</div>
              <div class="lb-info">
                <div class="lb-name">
                  ${esc(u.name)}
                  ${u.verified?`<svg width="11" height="11" viewBox="0 0 24 24" fill="var(--accent)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`:''}
                </div>
                <div class="lb-sub">
                  Score: ${fmtPts(u.balance)} · Profit: ${fmtPts(u.profit||0)}
                </div>
              </div>
              <div class="lb-value" style="font-size:.8rem; text-align:right">
                <div style="font-weight:800;color:var(--accent)">${fmtPts(u.balance)} pts</div>
                <div style="font-size:.7rem;color:var(--text-muted)">#${u.rBalance} Acc · #${u.rProfit} Profit</div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }catch(err){c.innerHTML=`<div class="empty-state"><h3>Error</h3><p>${esc(err.message)}</p></div>`}
}

async function reportComment(marketId,commentId,commentText,commentUser){

async function deleteComment(marketId,commentId){
  if(!confirm('Delete this comment?'))return;
  try{
    await dbUpdate(`comments/${marketId}/${commentId}`,{status:'hidden'});
    const reports=await dbGet('reportedComments');
    if(reports){const matching=Object.entries(reports).filter(([_,r])=>r.commentId===commentId);for(const[rid]of matching)await dbUpdate(`reportedComments/${rid}`,{status:'deleted'})}
    showToast('Comment removed','success');
    if(currentPage==='market-detail')renderMarketDetail(currentMarketId);else renderAdmin();
  }catch(err){showToast('Failed','error')}
}

                      <td><span class="badge badge-census">${esc(p.category)}</span></td>
                      <td style="font-family:var(--mono)">${p.totalVotes||0}</td>
                      <td style="font-size:.78rem">${lead?esc(lead[0])+' ('+lead[1]+')':'-'}</td>
                      <td><div style="display:flex;gap:4px">
                        <button class="btn btn-danger btn-sm" data-close-census="${p.id}">Close</button>
                        <button class="btn btn-danger btn-sm" data-delete-census="${p.id}">🗑</button>
                      </div></td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>`}
          `:''}

          ${tab==='users'?`
            <table class="admin-table">
              <thead><tr><th>Name</th><th>Email</th><th>Score</th><th>W/L</th><th>Status</th><th>Role</th></tr></thead>
              <tbody>
                ${users.sort((a,b)=>(b.balance||0)-(a.balance||0)).map(u=>`<tr>
                  <td style="font-weight:600">${esc(u.name)} ${u.verified?`<svg width="10" height="10" viewBox="0 0 24 24" fill="var(--accent)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`:''}</td>
                  <td style="color:var(--text-muted);font-size:.75rem">${esc(u.email)}</td>
                  <td style="font-family:var(--mono)">${fmtPts(u.balance)}</td>
                  <td style="font-size:.75rem">${u.correct||0}/${u.predictions||0}</td>
                  <td>${u.verified?'<span class="badge badge-active" style="font-size:.6rem">Verified</span>':'<span class="badge badge-pending" style="font-size:.6rem">Unverified</span>'}</td>
                  <td>${currentUser.role==='admin'&&u.id!==currentUser.id?`
                    <select class="admin-select role-sel" data-uid="${u.id}">
                      <option value="user" ${u.role==='user'?'selected':''}>User</option>
                      <option value="moderator" ${u.role==='moderator'?'selected':''}>Mod</option>
                      <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
                      <option value="banned" ${u.role==='banned'?'selected':''}>Banned</option>
                    </select>`:
                    `<span class="badge ${u.role==='admin'?'badge-active':u.role==='moderator'?'badge-pending':'badge-resolved'}">${u.role||'user'}</span>`}
                  </td>
                </tr>`).join('')}
              </tbody>
            </table>
          `:''}

          ${tab==='reports'?`
            ${reports.length===0?'<div class="empty-state"><h3>No pending reports</h3></div>':
              reports.map(r=>`
                <div class="card" style="margin-bottom:8px">
                  <div class="card-body" style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
                    <div style="flex:1">
                      <div style="font-size:.72rem;color:var(--text-muted);margin-bottom:5px">Reported by ${esc(r.reportedByName)} · ${timeAgo(r.timestamp)}</div>
                      <div style="font-size:.85rem;background:var(--bg-surface);padding:8px 12px;border-radius:7px;color:var(--text-secondary)">"${esc(r.commentText)}"</div>
                      <div style="font-size:.72rem;color:var(--text-muted);margin-top:4px">By: ${esc(r.commentUser)}</div>
                    </div>
                    <div style="display:flex;gap:6px">
                      <button class="btn btn-danger btn-sm" data-delete-report="${r.id}" data-market="${r.marketId}" data-comment="${r.commentId}">Delete</button>
                      <button class="btn btn-secondary btn-sm" data-dismiss-report="${r.id}">Dismiss</button>
                    </div>
                  </div>
                </div>`).join('')}
          `:''}
        </div>`;

      c.querySelectorAll('.tab-bar button').forEach(b=>{if(b.dataset.tab)b.onclick=()=>render(b.dataset.tab)});
      c.querySelectorAll('[data-approve]').forEach(b=>{b.onclick=async()=>{try{await dbUpdate(`markets/${b.dataset.approve}`,{status:'active'});const m2=await dbGet(`markets/${b.dataset.approve}`);await pushNotif(m2.creatorId,{text:`Your forecast "${m2.title}" was approved!`,icon:'✅',color:'#00e5a0'});showToast('Approved!','success');renderAdmin()}catch(e){showToast('Failed','error')}}});
      c.querySelectorAll('[data-reject]').forEach(b=>{b.onclick=async()=>{try{await dbUpdate(`markets/${b.dataset.reject}`,{status:'rejected'});showToast('Rejected','info');renderAdmin()}catch(e){showToast('Failed','error')}}});
      c.querySelectorAll('[data-approve-census]').forEach(b=>{b.onclick=async()=>{try{await dbUpdate(`censuses/${b.dataset.approveCensus}`,{status:'active'});showToast('Poll approved!','success');renderAdmin()}catch(e){showToast('Failed','error')}}});
      c.querySelectorAll('[data-reject-census]').forEach(b=>{b.onclick=async()=>{try{await dbUpdate(`censuses/${b.dataset.rejectCensus}`,{status:'rejected'});showToast('Poll rejected','info');renderAdmin()}catch(e){showToast('Failed','error')}}});
      c.querySelectorAll('[data-close-census]').forEach(b=>{b.onclick=async()=>{if(!confirm('Close this poll?'))return;try{await dbUpdate(`censuses/${b.dataset.closeCensus}`,{status:'closed'});showToast('Poll closed','success');renderAdmin()}catch(e){showToast('Failed','error')}}});
      c.querySelectorAll('[data-delete-census]').forEach(b=>{b.onclick=async()=>{if(!confirm('Delete this poll?'))return;try{await dbDelete(`censuses/${b.dataset.deleteCensus}`);showToast('Poll deleted','success');renderAdmin()}catch(e){showToast('Failed','error')}}});
      c.querySelectorAll('[data-lock]').forEach(b=>{b.onclick=async()=>{try{await dbUpdate(`markets/${b.dataset.lock}`,{status:'locked'});showToast('Market locked','info');renderAdmin()}catch(e){showToast('Failed','error')}}});
      c.querySelectorAll('[data-boost]').forEach(b=>{b.onclick=async()=>{try{const m2=await dbGet(`markets/${b.dataset.boost}`);await dbUpdate(`markets/${b.dataset.boost}`,{boosted:!m2.boosted,boostMultiplier:2});showToast(!m2.boosted?'⚡ Market boosted!':'Boost removed','success');renderAdmin()}catch(e){showToast('Failed','error')}}});
      c.querySelectorAll('[data-resolve-yes]').forEach(b=>{b.onclick=()=>adminResolve(b.dataset.resolveYes,'YES')});
      c.querySelectorAll('[data-resolve-no]').forEach(b=>{b.onclick=()=>adminResolve(b.dataset.resolveNo,'NO')});
      c.querySelectorAll('[data-refund]').forEach(b=>{b.onclick=()=>refundMarket(b.dataset.refund)});
      c.querySelectorAll('[data-delete-market]').forEach(b=>{b.onclick=async()=>{if(!confirm('Delete this market? This cannot be undone.'))return;try{await dbDelete(`markets/${b.dataset.deleteMarket}`);showToast('Market deleted','info');renderAdmin()}catch(e){showToast('Failed','error')}}});
      c.querySelectorAll('[data-delete-report]').forEach(b=>{b.onclick=async()=>{try{await dbUpdate(`comments/${b.dataset.market}/${b.dataset.comment}`,{status:'hidden'});await dbUpdate(`reportedComments/${b.dataset.deleteReport}`,{status:'deleted'});showToast('Comment removed','success');renderAdmin()}catch(e){showToast('Failed','error')}}});
      c.querySelectorAll('[data-dismiss-report]').forEach(b=>{b.onclick=async()=>{try{await dbUpdate(`reportedComments/${b.dataset.dismissReport}`,{status:'dismissed'});showToast('Dismissed','info');renderAdmin()}catch(e){showToast('Failed','error')}}});
      c.querySelectorAll('.role-sel').forEach(sel=>{sel.onchange=async()=>{try{await dbUpdate(`users/${sel.dataset.uid}`,{role:sel.value});showToast('Role updated','success')}catch(e){showToast('Failed','error')}}});
      const aab=document.getElementById('approve-all');
      if(aab)aab.onclick=async()=>{for(const m of pendingM){try{await dbUpdate(`markets/${m.id}`,{status:'active'})}catch(e){}}showToast(`Approved ${pendingM.length} forecasts`,'success');renderAdmin()};
      const rab=document.getElementById('reject-all');
      if(rab)rab.onclick=async()=>{if(!confirm('Reject ALL pending forecasts?'))return;for(const m of pendingM){try{await dbUpdate(`markets/${m.id}`,{status:'rejected'})}catch(e){}}showToast('All rejected','info');renderAdmin()};
      const pb=document.getElementById('panic-btn');
      if(pb)pb.onclick=()=>adminPanicButton();
    }
    render(tab);
  }catch(err){c.innerHTML=`<div class="empty-state"><h3>Error</h3><p>${esc(err.message)}</p></div>`}
}

async function adminResolve(marketId,resolution){
  openModal(`Resolve as ${resolution}`,`
    <p style="font-size:.84rem;color:var(--text-secondary);margin-bottom:12px">Please provide a source URL to confirm this resolution and prevent disputes.</p>
    <div class="form-group"><label>Resolution Source URL (optional)</label><input type="url" id="res-source" placeholder="https://hackleysports.com/results…"></div>
  `,`
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn ${resolution==='YES'?'btn-primary':'btn-danger'}" id="res-confirm">Confirm Resolve ${resolution}</button>
  `);
  document.getElementById('res-confirm').onclick=async()=>{
    const source=document.getElementById('res-source').value.trim();
    try{
      await resolveMarket(marketId,resolution,source);
      closeModal();showToast(`Resolved ${resolution}!`,'success');renderAdmin();
    }catch(e){showToast('Failed: '+e.message,'error')}
  };
}

async function resolveMarket(marketId,resolution,resolutionSource=''){
  await dbUpdate(`markets/${marketId}`,{status:'resolved',resolution,resolutionSource,resolvedAt:Date.now()});
  const trades=await dbGet('trades');if(!trades)return;
  const market=await dbGet(`markets/${marketId}`);
  const winnerTrades=Object.entries(trades).filter(([_,t])=>t.marketId===marketId&&t.side===resolution&&t.status!=='sold');
  const loserTrades=Object.entries(trades).filter(([_,t])=>t.marketId===marketId&&t.side!==resolution&&t.status!=='sold');
  for(const[tid,trade]of winnerTrades){
    try{
      const user=await dbGet(`users/${trade.userId}`);
      if(user){
        const boostMult=(market?.boosted&&market?.boostMultiplier)||1;
        // CORRECT PAYOUT: 1 share = 1 point, profit = shares - cost, boosted doubles profit
        const profit=(trade.shares-trade.cost)*boostMult;
        const payout=trade.cost+profit;
        const newBalance=(user.balance||0)+payout;
        const newProfit=(user.profit||0)+profit;
        const newCorrect=(user.correct||0)+1;
        const updates={balance:newBalance,profit:newProfit,correct:newCorrect};
        if(trade.category==='Sports')updates.sportStreak=(user.sportStreak||0)+1;
        if((user.balance||0)<0&&newBalance>0)updates.hadComeback=true;
        await dbUpdate(`users/${trade.userId}`,updates);
        await pushNotif(trade.userId,{text:`✅ You won! "${market?.title||'Market'}" resolved ${resolution}. +${profit.toFixed(2)} pts profit`,icon:'🎉',color:'#00e5a0',page:'profile'});
        await checkAndAwardAchievements({...user,...updates,id:trade.userId});
      }
    }catch(e){}
  }
  for(const[tid,trade]of loserTrades){
    try{
      await pushNotif(trade.userId,{text:`❌ "${market?.title||'Market'}" resolved ${resolution}. You lost ${trade.cost.toFixed(2)} pts.`,icon:'😔',color:'#ff3d5a',page:'profile'});
      const user=await dbGet(`users/${trade.userId}`);
      if(user){const s=trade.category==='Sports'?{sportStreak:0}:{};if(Object.keys(s).length>0)await dbUpdate(`users/${trade.userId}`,s)}
    }catch(e){}
  }

  if(currentUser){const u=await dbGet(`users/${currentUser.id}`);if(u){currentUser={...currentUser,...u};saveSession(currentUser);document.getElementById('balance-amount').textContent=fmtPts(currentUser.balance)}}
}

async function refundMarket(marketId){
  if(!confirm('Refund all participants? This returns all points and cancels the market.'))return;
  try{
    const trades=await dbGet('trades');
    if(trades){
      const marketTrades=Object.entries(trades).filter(([_,t])=>t.marketId===marketId&&t.status!=='sold');
      for(const[tid,trade]of marketTrades){
        const user=await dbGet(`users/${trade.userId}`);
        if(user){
          await dbUpdate(`users/${trade.userId}`,{balance:(user.balance||0)+trade.cost});
          await pushNotif(trade.userId,{text:`↩ Market refunded: "${(await dbGet(`markets/${marketId}`))?.title||'Market'}". You got back ${trade.cost.toFixed(2)} pts.`,icon:'↩',color:'#ffc107'});
        }
      }
    }
    await dbUpdate(`markets/${marketId}`,{status:'refunded'});
    showToast('Market refunded — all points returned','success');renderAdmin();
  }catch(e){showToast('Failed: '+e.message,'error')}
}

async function adminPanicButton(){
  if(!confirm('⚠️ PANIC BUTTON: This will lock ALL active markets, hide them from public, and refund all participants. Are you absolutely sure?'))return;
  if(!confirm('This cannot be undone easily. Last chance — continue?'))return;
  try{
    const markets=await dbGet('markets');
    if(markets){
      for(const[mid,m]of Object.entries(markets)){
        if(m.status==='active'){
          await refundMarket(mid);
          await dbUpdate(`markets/${mid}`,{status:'locked',hidden:true});
        }
      }
    }
    showToast('🚨 Panic executed — all markets locked and refunded','warn');renderAdmin();
  }catch(e){showToast('Partial failure: '+e.message,'error')}
}

  el.classList.add('selected');
};
